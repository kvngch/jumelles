name: Mesure

# A la demande, ou a chaque push sur la branche mesure
on:
  workflow_dispatch:
    inputs:
      photos:
        description: Nombre de photos de synthese de 12 Mpx
        default: "500"
  push:
    branches: [mesure]

jobs:
  mesure:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p jumelles-core --example mesure -- ${{ runner.temp }}/photos ${{ inputs.photos || '500' }} 4000 3000
