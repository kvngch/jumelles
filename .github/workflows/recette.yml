name: Recette

on:
  workflow_dispatch:
  push:
    branches: [recette]

jobs:
  recette:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p jumelles
      - run: pip install playwright pywinauto pillow pillow-heif rawpy psutil

      - name: Systeme
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber,WindowsInstallationType | Format-List
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled
          Get-AppxPackage | Where-Object Name -match 'Image|HEVC|Webp|Raw|VCLibs' | Select-Object Name,Version | Format-Table
          whoami; Get-Service LanmanServer, LanmanWorkstation
          Get-PSDrive -PSProvider FileSystem | Format-Table
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution
          query user

      - name: Echantillons
        continue-on-error: true
        run: |
          python -c "from PIL import Image; import pillow_heif; pillow_heif.register_heif_opener(); im=Image.new('RGB',(1200,800)); [im.putpixel((x,y),(x%256,y%256,(x*y)%256)) for x in range(0,1200,3) for y in range(0,800,3)]; im.save('s.jpg'); im.save('s.webp'); im.save('s.heic'); im.save('s.png'); im.save('s.tif'); im.save('s.bmp'); im.save('s.gif')"
          curl -sSL -o s.dng "https://raw.pixls.us/getfile.php/915/nice/Apple%20-%20iPhone%206s%20Plus%20-%2016bit%20(4:3).DNG"
          curl -sSL -o s.cr3 "https://raw.pixls.us/getfile.php/4659/nice/Canon%20-%20EOS%20R6%20-%203:2.CR3"
          dir s.*

      - name: Decodage sans extensions
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($f in 's.jpg','s.png','s.tif','s.bmp','s.gif','s.webp','s.heic','s.dng','s.cr3') {
            "== $f"; cargo run -q --release -p jumelles-core --example wic -- $f 2>&1 | Select-Object -First 4
          }

      - name: Extensions
        continue-on-error: true
        shell: pwsh
        run: |
          python recette/extensions.py ext
          Get-ChildItem ext\*.appx | ForEach-Object { Add-AppxPackage $_.FullName; "ok $($_.Name)" }
          Get-ChildItem ext\*bundle | ForEach-Object { try { Add-AppxPackage $_.FullName; "ok $($_.Name)" } catch { "echec $($_.Name) : $_" } }
          Get-AppxPackage | Where-Object Name -match 'Image|HEVC|Webp|Raw|VCLibs' | Select-Object Name,Version | Format-Table

      - name: Decodage avec extensions
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($f in 's.webp','s.heic','s.dng','s.cr3') {
            "== $f"; cargo run -q --release -p jumelles-core --example wic -- $f 2>&1 | Select-Object -First 6
          }

      - name: Partage reseau
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory C:\partage | Out-Null
          New-SmbShare -Name reseau -Path C:\partage -FullAccess $env:USERNAME | Format-List Name,Path
          net use R: \\localhost\reseau /persistent:no
          [IO.DriveInfo]::new('R').DriveType
          Set-Content R:\essai.txt 'x'; Get-Item C:\partage\essai.txt

      - name: Support amovible
        continue-on-error: true
        shell: pwsh
        run: |
          choco install imdisk-toolkit -y --no-progress | Select-Object -Last 3
          imdisk -a -s 256M -m U: -o rem -p "/fs:fat32 /q /y"
          [IO.DriveInfo]::new('U').DriveType
          [IO.DriveInfo]::new('U').DriveFormat

      - name: Fenetre et dialogue
        continue-on-error: true
        run: |
          mkdir C:\dossier-essai\sous
          python recette/sonde.py target\release\jumelles.exe C:\dossier-essai

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonde
          path: "*.png"
