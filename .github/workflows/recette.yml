name: Recette

on:
  workflow_dispatch:
  push:
    branches: [recette]

jobs:
  recette:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p jumelles
      - run: pip install playwright pywinauto pillow pillow-heif rawpy psutil

      - name: Fenetre et dialogue
        continue-on-error: true
        run: |
          mkdir C:\dossier-essai\sous | Out-Null
          python recette/sonde.py target\release\jumelles.exe C:\dossier-essai

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonde
          path: "*.png"
