name: Release

# Au push d'un tag v*, par exemple v0.1.0 ou v0.1.0-alpha.1. La release est creee en
# brouillon : notes relues avant publication.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      - name: Tag et version de Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "le tag ${{ github.ref_name }} ne correspond pas a la version $v" }

      - run: cargo test -p jumelles-core
      - run: cargo build --release -p jumelles

      - name: Zip et empreinte
        shell: pwsh
        run: |
          $nom = "jumelles-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $nom | Out-Null
          Copy-Item target\release\jumelles.exe "$nom\Jumelles.exe"
          Compress-Archive -Path $nom -DestinationPath "$nom.zip"
          $h = (Get-FileHash "$nom.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $nom.zip" | Set-Content -Encoding ascii "$nom.zip.sha256"
          Get-Content "$nom.zip.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          name: Jumelles ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            jumelles-*-windows-x64.zip
            jumelles-*-windows-x64.zip.sha256
