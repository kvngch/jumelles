[package]
name = "jumelles-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = "1.12"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target."cfg(windows)".dependencies]
winapi-util = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target."cfg(not(windows))".dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12"
