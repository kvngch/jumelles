<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jumelles</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Jumelles</h1>

  <section>
    <h2>Dossiers à analyser</h2>
    <ul id="liste" class="dossiers"></ul>
    <p id="vide" class="discret">Aucun dossier. Ajoutez-en un ou déposez-le dans la fenêtre.</p>
    <div class="actions">
      <button id="ajouter" type="button">Ajouter un dossier</button>
      <label class="reglage">Ressemblance
        <select id="ecart">
          <option value="4">Stricte</option>
          <option value="10" selected>Normale</option>
          <option value="14">Large</option>
        </select>
      </label>
      <button id="analyser" type="button" class="principal" disabled>Analyser</button>
    </div>
    <p id="etat" class="discret" role="status"></p>
  </section>

  <section id="resultats" hidden>
    <h2 id="titre-resultats"></h2>
    <div id="groupes"></div>
  </section>
</body>
</html>
