<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jumelles</title>
  <link rel="stylesheet" href="style.css">
  <script src="fr.js" defer></script>
  <script src="en.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <header class="haut">
    <span class="marque">Jumelles</span>
    <span id="resume" class="resume discret"></span>
    <button id="nouvelle" type="button" class="bouton" data-action="accueil" hidden></button>
  </header>

  <main id="ecran"></main>

  <footer id="action" class="action" hidden>
    <p id="total"></p>
    <button id="deplacer" type="button" class="bouton" data-action="deplacer"></button>
    <button id="corbeille" type="button" class="bouton principal" data-action="corbeille"></button>
  </footer>

  <dialog id="confirmer">
    <h2 id="confirmer-titre" class="titre"></h2>
    <p id="confirmer-texte"></p>
    <div class="boutons">
      <button id="confirmer-non" type="button" class="bouton"></button>
      <button id="confirmer-oui" type="button" class="bouton principal"></button>
    </div>
  </dialog>

  <div id="zoom" class="zoom" role="dialog" aria-modal="true" hidden>
    <img id="zoom-image" alt="">
    <button id="zoom-fermer" type="button" class="bouton"></button>
  </div>
</body>
</html>
